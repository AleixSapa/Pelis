services:
  pelitrack:
    build: .
    container_name: pelitrack
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Volum Docker amb nom: no depèn de la carpeta on es desplega el codi.
      - pelitrack_data:/app/data
      # Compatibilitat: permet migrar automàticament la base de dades antiga.
      - ./pelitrack-data:/app/legacy-data:ro

volumes:
  pelitrack_data:
    name: pelitrack_data
