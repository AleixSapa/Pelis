services:
  pelitrack:
    build: .
    container_name: pelitrack
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - pelitrack_data:/data
      - ./pelitrack-data:/app/legacy-data:ro
    environment:
      DB_PATH: /data/pelitrack.db

volumes:
  pelitrack_data:
    name: pelitrack_data
    external: true
