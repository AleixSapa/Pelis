services:
  pelitrack:
    build: .
    container_name: pelitrack
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # IMPORTANT: aquest volum ha d'existir abans del desplegament.
      # Així Dockploy/Docker no el pot recrear accidentalment en cada deploy.
      - pelitrack_data:/app/data
      # Compatibilitat: permet migrar automàticament una base de dades antiga.
      - ./pelitrack-data:/app/legacy-data:ro

volumes:
  pelitrack_data:
    name: pelitrack_data
    external: true
